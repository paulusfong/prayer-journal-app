name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether code/deps/test tooling changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'stryker.config.mjs'
              - '.c8rc.json'
              - 'next.config.ts'
              - '.github/workflows/ci.yml'

  # Heavy suite — only when relevant paths change.
  suite:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Coverage gate (100% lines/statements/functions)
        run: npm run test:coverage

      - name: Mutation testing (Stryker break threshold)
        run: npm run test:mutation

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  # Required check name stays `test` (branch ruleset). Passes when:
  # - no code paths changed (skip heavy suite), or
  # - suite succeeded.
  test:
    needs: [changes, suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate required status check
        run: |
          set -euo pipefail
          code="${{ needs.changes.outputs.code }}"
          suite="${{ needs.suite.result }}"
          echo "code_paths_changed=${code}"
          echo "suite_result=${suite}"
          if [ "${code}" != "true" ]; then
            echo "No src/deps/test-config changes — skipping heavy CI."
            exit 0
          fi
          if [ "${suite}" = "success" ]; then
            echo "Suite passed."
            exit 0
          fi
          echo "Suite required but did not succeed (${suite})."
          exit 1
