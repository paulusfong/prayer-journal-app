# Promote to `.github/workflows/ci.yml` with a token that has the `workflow` scope
# (GitHub blocks PAT pushes that create workflow files without that scope).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Coverage gate (100% lines/statements/functions)
        run: npm run test:coverage

      - name: Mutation testing (Stryker break threshold)
        run: npm run test:mutation

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: |
            reports/
          retention-days: 14
          if-no-files-found: warn
